name: Build and Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./app
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: ./app
        run: npm test

      - name: Build Docker image (local check)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: mirrornode-core:ci
